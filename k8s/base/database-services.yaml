apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: venue-booking
  labels:
    app.kubernetes.io/name: venue-booking
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: venue-booking
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: database-headless
  namespace: venue-booking
  labels:
    app.kubernetes.io/name: venue-booking
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: venue-booking
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
