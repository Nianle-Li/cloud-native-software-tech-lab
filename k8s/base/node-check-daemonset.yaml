apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-check
  namespace: venue-booking
  labels:
    app.kubernetes.io/name: venue-booking
    app.kubernetes.io/component: node-check
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: venue-booking
      app.kubernetes.io/component: node-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: venue-booking
        app.kubernetes.io/component: node-check
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: node-check
          image: venue-booking-node-check:lab2-20261116-01
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          readinessProbe:
            exec:
              command: [sh, -c, 'nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
